[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cessna172-glide-stall-simulator"
version = "0.1.0"
description = "2D engineering glide and stall test of a Cessna 172 after engine failure."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sahand"},
]
dependencies = [
    "numpy",
    "scipy",
    "pygame-ce",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cessna-sim = "cessna_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
